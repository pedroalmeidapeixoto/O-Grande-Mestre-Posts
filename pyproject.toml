[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stories-bot"
version = "0.1.0"
description = "Scheduled Instagram Stories publisher on the official Graph API, run by GitHub Actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Henrique de Almeida Peixoto" }]
dependencies = ["requests>=2.31", "tzdata"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
stories-bot = "stories_bot.cli:main"
stories-token = "stories_bot.token_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=stories_bot --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
