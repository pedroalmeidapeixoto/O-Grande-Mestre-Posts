name: Publish Stories

on:
  schedule:
    # Every 15 minutes (UTC). The bot only publishes what falls inside a schedule window.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write # to commit state/posted.json

concurrency:
  group: publish-stories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Publish due Stories
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: stories-bot
      - name: Save publish record
        if: always()
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          git add state/posted.json || true
          git diff --cached --quiet || (git commit -m "chore: record published stories" && git push)
