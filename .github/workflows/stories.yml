name: Publish Stories

on:
  schedule:
    # Every 15 minutes (UTC). The bot only publishes what falls inside a schedule window.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write # to commit state/posted.json

concurrency:
  group: publish-stories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the tip of the branch, so a re-run of an old run can still commit and push.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Receive arts sent to the Telegram bot
        # Never blocks publishing what is already scheduled.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: stories-inbox
      - name: Commit received arts
        # The arts must be on GitHub before publishing: Meta downloads them from the public URL.
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          git add media schedule.json
          git add state/telegram.json || true
          git diff --cached --quiet || (git commit -m "chore: receive arts from Telegram" && (git push || (git pull --rebase && git push)))
      - name: Publish due Stories
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }} # YYYY-MM-DD, drives the expiry reminder
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: stories-bot
      - name: Save publish record
        if: always()
        run: |
          git config user.name "stories-bot"
          git config user.email "stories-bot@users.noreply.github.com"
          for f in state/posted.json state/attempts.json state/reminders.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "chore: record published stories" && (git push || (git pull --rebase && git push)))
